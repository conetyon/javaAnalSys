# 匹配策略配置 - 生产环境
# Updated: 2026-01-31 (v1.3.1 配置与代码解耦)
# Purpose: API 生产环境的阈值和权重配置

# 默认配置（被 strategies.py 的 get_weight_defaults() 加载）
default:
  # 过滤阈值（质量保证）
  ast_min_ratio: 0.4      # AST覆盖率最低阈值
  keyword_min_score: 0.4  # 关键词得分最低阈值

  # 权重配置（加权融合）
  w_ast: 0.5              # AST结构匹配权重
  w_keyword: 0.4          # 关键词匹配权重
  w_difficulty: 0.1       # 难度匹配权重

# 配置说明
notes: |
  此文件仅用于 API 生产环境，评估实验使用脚本内硬编码配置。

  权重设计原则（基于消融实验 experiment.py 结果）:
  1. AST权重（0.5）: 提供结构验证，与关键词协同达到最优效果
  2. 关键词权重（0.4）: Keyword Only 准确率 53.54%，是最重要的单一特征
  3. 难度权重（0.1）: 用户体验增强但不主导排序

  版本历史:
  - v1.3.1 (2026-01-31): 配置与代码解耦，strategies.py 从此文件加载
