# =============================================================================
# 匹配策略配置文件
# =============================================================================
#
# 用途: 生产环境 + 主评估的默认权重配置
#
# 加载链路:
#   matching.yaml
#       ↓ lib/utils/matching_config.py
#   strategies.py :: get_weight_defaults()
#       ↓
#   search_service.py :: search() (当不传 w_* 参数时)
#       ↓
#   API /api/match  |  主评估 run_graded_evaluation()
#
# 使用场景:
#   ✅ API 生产环境 - 使用此配置
#   ✅ 主评估 (run_graded_evaluation) - 使用此配置
#   ❌ 消融实验 (run_graded_ablation) - 使用脚本内硬编码配置
#
# 注意:
#   - 修改此文件会影响 API 返回结果和主评估结果
#   - 消融实验需要测试多种配置，所以不依赖此文件
#   - 权重有缓存机制，修改后需重启服务/进程生效
#
# Updated: 2026-02-07 (v1.3.4)
# =============================================================================

default:
  # ---------------------------------------------------------------------------
  # 过滤阈值（质量保证）
  # 低于阈值的候选结果会被过滤掉（score=0）
  # ---------------------------------------------------------------------------
  ast_min_ratio: 0.4        # AST 覆盖率最低阈值（模板节点覆盖比例）
  keyword_min_score: 0.4    # 关键词得分最低阈值（加权匹配分数）

  # ---------------------------------------------------------------------------
  # 权重配置（加权融合）
  # final_score = w_ast × ast_score + w_keyword × kw_score + w_difficulty × diff_score
  # ---------------------------------------------------------------------------
  w_ast: 0.2                # AST 结构匹配权重（降低：单独效果差，避免噪声）
  w_keyword: 0.7            # 关键词匹配权重（提高：最重要特征，单独达 97.7%）
  w_difficulty: 0.1         # 难度匹配权重（保持：UX 增强，不主导排序）

# =============================================================================
# 消融实验结论（2026-02-07，56 KP，554 评估片段）
# =============================================================================
#
# | 配置            | Binary P | Graded P | 说明                        |
# |-----------------|----------|----------|-----------------------------|
# | Full (当前配置)  | 98.0%    | 58.4%    | 生产推荐                     |
# | Keyword Only    | 97.7%    | 59.2%    | 关键词是最重要特征            |
# | AST + Keyword   | 98.0%    | 58.5%    | AST 辅助排序                 |
# | AST Only        | 55.8%    | 32.3%    | 单独效果差，需配合关键词      |
#
# 关键发现:
# 1. Keyword 是核心特征：单独达到 97.7% Binary Precision
# 2. AST 辅助排序：单独只有 55.8%，但与 Keyword 组合可提升 nDCG
# 3. Difficulty 增强 UX：不影响准确率，但提供难度匹配能力
#
# =============================================================================
# 版本历史
# =============================================================================
#
# v1.3.4 (2026-02-07): 基于消融实验优化权重 AST=0.2, KW=0.7, DIFF=0.1
